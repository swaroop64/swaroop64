<svg xmlns="http://www.w3.org/2000/svg" width="890" height="240" viewBox="0 0 890 240" role="img" aria-label="What I do, where I work, and what to ask me about" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6FEB"/>
      <stop offset="1" stop-color="#8957E5"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .title { font-size: 17px; font-weight: 600; fill: #F0F6FC; }
      .item  { font-size: 14.5px; fill: #C9D1D9; }
      .dot   { fill: #58A6FF; }
      .card  { fill: url(#bg); stroke: #30363D; stroke-width: 1; }
      .ring  { fill: #0D1117; stroke: url(#g); stroke-width: 1.5; }
      .ico   { fill: none; stroke: #58A6FF; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .bar   { fill: url(#g); }
      .c { animation: rise 0.7s ease-out both; }
      .c2 { animation-delay: .15s; }
      .c3 { animation-delay: .30s; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { .c { animation: none; } }
    </style>
  </defs>

  <!-- Card 1: What I do -->
  <g class="c">
    <rect class="card" x="20" y="20" width="270" height="200" rx="14"/>
    <path class="bar" d="M20 34a14 14 0 0 1 14-14h242a14 14 0 0 1 14 14v0H20z"/>
    <circle class="ring" cx="54" cy="64" r="20"/>
    <path class="ico" d="M47 58l-6 6 6 6M61 58l6 6-6 6M56 55l-4 18" transform="translate(1 0)"/>
    <text class="title" x="86" y="70">What I do</text>
    <circle class="dot" cx="42" cy="112" r="3"/><text class="item" x="54" y="117">Backend validation</text>
    <circle class="dot" cx="42" cy="146" r="3"/><text class="item" x="54" y="151">API testing</text>
    <circle class="dot" cx="42" cy="180" r="3"/><text class="item" x="54" y="185">System integration</text>
  </g>

  <!-- Card 2: Where I work -->
  <g class="c c2">
    <rect class="card" x="310" y="20" width="270" height="200" rx="14"/>
    <path class="bar" d="M310 34a14 14 0 0 1 14-14h242a14 14 0 0 1 14 14v0H310z"/>
    <circle class="ring" cx="344" cy="64" r="20"/>
    <path class="ico" d="M337 74V55h14v19M351 74v-11h8v11M335 74h26M341 60h4M341 66h4" transform="translate(-4 0)"/>
    <text class="title" x="376" y="70">Where I work</text>
    <circle class="dot" cx="332" cy="112" r="3"/><text class="item" x="344" y="117">Infinite Computer Solutions</text>
    <circle class="dot" cx="332" cy="146" r="3"/><text class="item" x="344" y="151">Telecom projects</text>
    <circle class="dot" cx="332" cy="180" r="3"/><text class="item" x="344" y="185">Digital platforms</text>
  </g>

  <!-- Card 3: Ask me about -->
  <g class="c c3">
    <rect class="card" x="600" y="20" width="270" height="200" rx="14"/>
    <path class="bar" d="M600 34a14 14 0 0 1 14-14h242a14 14 0 0 1 14 14v0H600z"/>
    <circle class="ring" cx="634" cy="64" r="20"/>
    <path class="ico" d="M624 56h20a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-9l-6 5v-5h-5a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3z" transform="translate(0 -1)"/>
    <path class="ico" d="M630 62.5h.01M635 62.5h.01M640 62.5h.01" stroke-width="2.4"/>
    <text class="title" x="666" y="70">Ask me about</text>
    <circle class="dot" cx="622" cy="112" r="3"/><text class="item" x="634" y="117">Python</text>
    <circle class="dot" cx="622" cy="146" r="3"/><text class="item" x="634" y="151">Testing strategy</text>
    <circle class="dot" cx="622" cy="180" r="3"/><text class="item" x="634" y="185">MySQL</text>
  </g>
</svg>
